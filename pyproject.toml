[project]
name = "idd-spatial-analysis"
version = "0.1.0"
description = "Geospatial analysis tools for IDD research"
authors = [{ name = "Bobby Reiner", email = "bcreiner@uw.edu" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<4"
dependencies = [
    "geopandas>=0.14",
    "rasterio>=1.3",
    "xarray>=2025.10.1",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pandas>=2.0",
    "numpy>=2.3.4",
    "rasterra>=0.6.3",
    "matplotlib>=3.10",
    "scipy>=1.17",
    "joblib>=1.5",
    "cartopy>=0.25",
    "fiona>=1.10",
    "rioxarray>=0.19",
]

[project.optional-dependencies]
notebooks = ["pyarrow>=23"]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "black>=23",
    "isort>=5.12",
    "flake8>=6",
    "jupyter>=1",
    "ipykernel>=7",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88
