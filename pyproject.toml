[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "idd-spatial-analysis"
version = "0.1.0"
description = "Geospatial analysis tools for IDD research"
authors = ["Bobby Reiner <bcreiner@uw.edu>"]
readme = "README.md"
license = "MIT"
packages = [{include = "idd_spatial_analysis", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
geopandas = "^0.14.0"
rasterio = "^1.3.0"
xarray = "^2023.0.0"
shapely = "^2.0.0"
pyproj = "^3.6.0"
pandas = "^2.0.0"
numpy = "^1.24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
jupyter = "^1.0.0"
ipykernel = "^6.25.0"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88
