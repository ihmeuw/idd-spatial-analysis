repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        files: ^src/
        # The pre-commit mypy runs in an isolated env — it cannot see the
        # project env's packages. List the typed runtime deps mypy needs so
        # pre-commit and local `mypy src/` agree; untyped geospatial libraries
        # resolve to Any under ignore_missing_imports either way.
        additional_dependencies:
          - numpy>=2.0
          - click>=8.0
          - types-PyYAML

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-ast
      - id: check-added-large-files
        # uv.lock is committed by standard and grows past 500 KB with the geospatial stack.
        exclude: ^uv\.lock$

  - repo: local
    hooks:
      - id: no-absolute-paths
        name: block absolute filesystem paths
        # Public-bound repo: no absolute cluster paths in any committed file. .example files use
        # placeholder paths (/your/cluster/path/...) that do not match this regex by design.
        entry: bash -c 'git diff --cached --name-only --diff-filter=d -z | grep -zvE "\.pre-commit-config\.yaml$" | xargs -0 -r grep -lE "(/ihme/|/snfs1/|/home/j/|/mnt/share/|^[A-Z]:\\\\)" 2>/dev/null | (! grep .)'
        language: system
        pass_filenames: false
